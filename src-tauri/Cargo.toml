[package]
name = "voice-input"
version = "0.1.0"
description = "VoiceInput - system-wide voice dictation for macOS"
authors = ["dogeheng"]
license = "MIT"
repository = "https://github.com/dogeheng/Vocal-inputer"
edition = "2021"
rust-version = "1.85"
default-run = "voice-input"

[lib]
name = "voice_input_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tauri-plugin-macos-permissions = "2"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
futures-util = "0.3"
cpal = "0.16"
sherpa-onnx = "2.0.0"
hound = "3.5"
base64 = "0.22"
parking_lot = "0.12"
crossbeam-channel = "0.5"
once_cell = "1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.37", features = ["bundled"] }
security-framework = "3"
core-graphics = "0.24"
core-foundation = "0.10"
core-foundation-sys = "0.8"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSData", "NSArray"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSPasteboardItem", "NSWorkspace", "NSRunningApplication"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true

[features]
# Developer benchmark tool; not built (or bundled) by default.
bench = []

[[bin]]
name = "vi_bench"
path = "src/bin/vi_bench.rs"
required-features = ["bench"]
